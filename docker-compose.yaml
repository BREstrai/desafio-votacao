name: desafio-votacao

services:
  postgres:
    image: docker.io/library/postgres:17
    container_name: votacao-postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-votacao}
      POSTGRES_USER: ${DB_USER:-votacao}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-votacao}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:8
    container_name: votacao-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-votacao}" ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG" ]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-votacao}
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
